name: Moomoo Signal Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/paper_trade_kickstart"

concurrency:
  group: moomoo-signal-pipeline
  cancel-in-progress: false

jobs:
  signal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 420
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN }}
      AI_HEDGE_FUND_TELEGRAM_CHAT_ID: ${{ secrets.AI_HEDGE_FUND_TELEGRAM_CHAT_ID }}
      AI_HEDGE_FUND_DAY_SUMMARY_BOT_TOKEN: ${{ secrets.AI_HEDGE_FUND_DAY_SUMMARY_BOT_TOKEN }}
      AI_HEDGE_FUND_DAY_SUMMARY_CHAT_ID: ${{ secrets.AI_HEDGE_FUND_DAY_SUMMARY_CHAT_ID }}
      PYTHONUTF8: "1"
      MOOMOO_OPEND_ENABLED: "true"
      MOOMOO_READ_ONLY: "true"
      MOOMOO_OPEND_HOST: "127.0.0.1"
      MOOMOO_OPEND_PORT: "11111"
      MOOMOO_SIGNAL_CANDLES: "50"
      MOOMOO_SIGNAL_INTERVAL: "5m"
      MOOMOO_SIGNAL_MAX_AI_CANDIDATES: "10"
      MOOMOO_SIGNAL_MAX_PAPER_TRADES: "10"
      MOOMOO_SIGNAL_CYCLE_MINUTES: "10"
      MOOMOO_SIGNAL_SCAN_DELAY_SECONDS: "3.2"
      MOOMOO_SIGNAL_SUBSCRIPTION_BATCH_SIZE: "45"
      SESSION_RUN_UNTIL_CLOSE: "true"
      EXECUTE_PAPER: "true"
      MOOMOO_PAPER_TRADING_ENABLED: "true"
      MOOMOO_LIVE_TRADING_ENABLED: "false"
      AI_HEDGE_FUND_STARTING_CAPITAL: "100"
      AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED: "90"
      AI_HEDGE_FUND_RISK_PER_TRADE_PCT: "50"
      AI_HEDGE_FUND_MAX_POSITIONS: "0"
      AI_HEDGE_FUND_MAX_DAILY_LOSS: "10"
      AI_HEDGE_FUND_LIVE_TRADING_ARMED: "false"
      AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS: "false"
      TRADINGAGENTS_LLM_MAX_RETRIES: "1"
      TRADINGAGENTS_LIGHTWEIGHT_PAPER_AI: "true"
      GEMINI_PAPER_AI_MODEL: "gemini-3.1-flash-lite"
      GEMINI_PAPER_AI_TIMEOUT_SECONDS: "45"
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate runner Python 3.12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Runner identity:"
          whoami
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "PATH python candidates:"
          & where.exe python 2>&1 | ForEach-Object { Write-Host $_ }
          & where.exe py 2>&1 | ForEach-Object { Write-Host $_ }

          $candidates = New-Object System.Collections.Generic.List[string]

          $pyLauncher = (Get-Command py.exe -ErrorAction SilentlyContinue).Source
          if ($pyLauncher) {
            Write-Host "Python Launcher: $pyLauncher"
            try {
              $launcherVersion = (& $pyLauncher -3.12 --version 2>&1 | Out-String).Trim()
              Write-Host "py -3.12 -> $launcherVersion"
              $launcherPath = (& $pyLauncher -3.12 -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1).Trim()
              if ($launcherPath -and (Test-Path $launcherPath)) { $candidates.Add($launcherPath) }
            } catch { Write-Host "Python Launcher could not resolve Python 3.12" }
          }

          $registryKeys = @(
            'HKCU:\Software\Python\PythonCore\3.12\InstallPath',
            'HKLM:\Software\Python\PythonCore\3.12\InstallPath',
            'HKLM:\Software\WOW6432Node\Python\PythonCore\3.12\InstallPath'
          )
          foreach ($key in $registryKeys) {
            try {
              $installPath = (Get-ItemProperty -Path $key -Name '(default)' -ErrorAction Stop).'(default)'
              if ($installPath) {
                $candidate = Join-Path $installPath 'python.exe'
                Write-Host "Registry Python path: $candidate"
                if (Test-Path $candidate) { $candidates.Add($candidate) }
              }
            } catch { }
          }

          $knownCandidates = @(
            "$env:USERPROFILE\AppData\Local\Programs\Python\Python312\python.exe",
            "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe",
            "C:\Users\runneradmin\AppData\Local\Programs\Python\Python312\python.exe",
            "C:\Users\Runner\AppData\Local\Programs\Python\Python312\python.exe",
            "C:\Python312\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files (x86)\Python312\python.exe",
            "D:\Python312\python.exe"
          )
          foreach ($candidate in $knownCandidates) {
            if (Test-Path $candidate) { $candidates.Add($candidate) }
          }

          if (Test-Path 'C:\Users') {
            Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $candidate = Join-Path $_.FullName 'AppData\Local\Programs\Python\Python312\python.exe'
              if (Test-Path $candidate) { $candidates.Add($candidate) }
            }
          }

          # Do not accept the runner toolcache Python blindly. A previous
          # setup-python attempt left an incomplete copy there without pip.
          $python = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            try {
              $version = (& $candidate --version 2>&1 | Out-String).Trim()
              $majorMinor = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>$null | Out-String).Trim()
              $pipCheck = (& $candidate -c "import pip; print(pip.__version__)" 2>&1 | Out-String).Trim()
              Write-Host "Checking $candidate -> $version | pip=$pipCheck"
              if ($LASTEXITCODE -eq 0 -and $majorMinor -eq '3.12' -and $pipCheck -notmatch 'No module named pip') {
                $python = (Resolve-Path $candidate).Path
                break
              }
            } catch { Write-Host "Unable to validate $candidate" }
          }

          if (-not $python) {
            throw "No usable Python 3.12 installation with pip was found for the Windows runner account. The runner toolcache copy is intentionally rejected because it is incomplete."
          }

          Write-Host "Using usable Python 3.12: $python"
          & $python --version
          & $python -c "import sys, pip; print(sys.executable); print('pip:', pip.__version__); print('UTF-8 mode:', sys.flags.utf8_mode)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pythonDir = Split-Path $python
          "$pythonDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$(Join-Path $pythonDir 'Scripts')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON_312_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Python 3.12 and pip
        shell: powershell
        run: |
          $python = $env:PYTHON_312_PATH
          if (-not $python) { throw "PYTHON_312_PATH was not set." }
          & $python --version
          & $python -c "import sys, pip; assert sys.version_info[:2] == (3,12); print(sys.executable); print(sys.version); print('pip:', pip.__version__); print('UTF-8 mode:', sys.flags.utf8_mode)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install project
        shell: powershell
        run: |
          $python = $env:PYTHON_312_PATH
          if (-not $python) { throw "PYTHON_312_PATH was not set." }
          & $python --version
          & $python -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate required secrets
        shell: cmd
        run: |
          if "%DATABASE_URL%"=="" (
            echo ERROR: NEON_DATABASE_URL is not configured.
            exit /b 1
          )
          if "%OPENAI_API_KEY%"=="" if "%GEMINI_API_KEY%"=="" (
            echo ERROR: OPENAI_API_KEY or GEMINI_API_KEY is required.
            exit /b 1
          )
          if "%AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN%"=="" (
            echo ERROR: AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN is not configured.
            exit /b 1
          )
          if "%AI_HEDGE_FUND_TELEGRAM_CHAT_ID%"=="" (
            echo ERROR: AI_HEDGE_FUND_TELEGRAM_CHAT_ID is not configured.
            exit /b 1
          )
          echo Required secrets are configured.
          echo Telegram notifier configuration is present.

      - name: Diagnose AI providers
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts\diagnose_ai_providers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Moomoo OpenD universe paper pipeline for full regular session
        shell: powershell
        env:
          OPENAI_API_KEY: ""
        run: |
          echo "MOOMOO_SIGNAL_UNIVERSE=default broad US universe"
          echo "MOOMOO_SIGNAL_CANDLES=$env:MOOMOO_SIGNAL_CANDLES"
          echo "MOOMOO_SIGNAL_INTERVAL=$env:MOOMOO_SIGNAL_INTERVAL"
          echo "MOOMOO_SIGNAL_MAX_AI_CANDIDATES=$env:MOOMOO_SIGNAL_MAX_AI_CANDIDATES"
          echo "MOOMOO_SIGNAL_MAX_PAPER_TRADES=$env:MOOMOO_SIGNAL_MAX_PAPER_TRADES"
          echo "MOOMOO_SIGNAL_CYCLE_MINUTES=$env:MOOMOO_SIGNAL_CYCLE_MINUTES"
          echo "MOOMOO_SIGNAL_SCAN_DELAY_SECONDS=$env:MOOMOO_SIGNAL_SCAN_DELAY_SECONDS"
          echo "MOOMOO_SIGNAL_SUBSCRIPTION_BATCH_SIZE=$env:MOOMOO_SIGNAL_SUBSCRIPTION_BATCH_SIZE"
          echo "SESSION_RUN_UNTIL_CLOSE=$env:SESSION_RUN_UNTIL_CLOSE"
          echo "EXECUTE_PAPER=$env:EXECUTE_PAPER"
          echo "MOOMOO_PAPER_TRADING_ENABLED=$env:MOOMOO_PAPER_TRADING_ENABLED"
          echo "MOOMOO_LIVE_TRADING_ENABLED=$env:MOOMOO_LIVE_TRADING_ENABLED"
          echo "TRADINGAGENTS_LIGHTWEIGHT_PAPER_AI=$env:TRADINGAGENTS_LIGHTWEIGHT_PAPER_AI"
          echo "GEMINI_PAPER_AI_MODEL=$env:GEMINI_PAPER_AI_MODEL"
          echo "GEMINI_PAPER_AI_TIMEOUT_SECONDS=$env:GEMINI_PAPER_AI_TIMEOUT_SECONDS"
          echo "AI_HEDGE_FUND_STARTING_CAPITAL=$env:AI_HEDGE_FUND_STARTING_CAPITAL"
          echo "AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED=$env:AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED"
          echo "AI_HEDGE_FUND_RISK_PER_TRADE_PCT=$env:AI_HEDGE_FUND_RISK_PER_TRADE_PCT"
          echo "AI_HEDGE_FUND_MAX_POSITIONS=$env:AI_HEDGE_FUND_MAX_POSITIONS"
          echo "AI_HEDGE_FUND_MAX_DAILY_LOSS=$env:AI_HEDGE_FUND_MAX_DAILY_LOSS"
          echo "AI_HEDGE_FUND_LIVE_TRADING_ARMED=$env:AI_HEDGE_FUND_LIVE_TRADING_ARMED"
          echo "AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS=$env:AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS"
          & $env:PYTHON_312_PATH scripts\run_moomoo_signal_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Send paper day summary to dedicated Telegram
        if: always()
        shell: powershell
        run: |
          if ($env:PYTHON_312_PATH) {
            & $env:PYTHON_312_PATH --version
            & $env:PYTHON_312_PATH scripts\send_paper_day_summary.py
            exit $LASTEXITCODE
          }
          Write-Host "PYTHON_312_PATH unavailable; skipping summary because Python bootstrap failed."
          exit 0
