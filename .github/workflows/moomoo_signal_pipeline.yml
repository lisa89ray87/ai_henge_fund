name: Moomoo Signal Pipeline

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "US stock symbol, for example US.AAPL"
        required: true
        default: "US.AAPL"
        type: string
      candles:
        description: "Number of candles to load"
        required: true
        default: "50"
        type: string
      interval:
        description: "Candle interval"
        required: true
        default: "5m"
        type: choice
        options:
          - "1m"
          - "5m"
          - "15m"
          - "30m"
          - "60m"
          - "1d"
      execute_paper:
        description: "Explicitly enable Moomoo SIMULATE paper execution"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - ".github/paper_trade_kickstart"

concurrency:
  group: moomoo-signal-pipeline
  cancel-in-progress: false

jobs:
  signal:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHON_ROOT: "C:\Users\limli\AppData\Local\Programs\Python\Python312"
      MOOMOO_OPEND_ENABLED: "true"
      MOOMOO_READ_ONLY: "true"
      MOOMOO_OPEND_HOST: "127.0.0.1"
      MOOMOO_OPEND_PORT: "11111"
      MOOMOO_SIGNAL_SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'US.AAPL' }}
      MOOMOO_SIGNAL_CANDLES: ${{ github.event_name == 'workflow_dispatch' && inputs.candles || '50' }}
      MOOMOO_SIGNAL_INTERVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.interval || '5m' }}
      EXECUTE_PAPER: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_paper || contains(github.event.head_commit.message, '[paper-trade]') }}
      MOOMOO_PAPER_TRADING_ENABLED: "true"
      MOOMOO_LIVE_TRADING_ENABLED: "false"
      TRADINGAGENTS_LLM_MAX_RETRIES: "1"
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify self-hosted runner and Python
        shell: cmd
        run: |
          echo Runner identity:
          whoami
          echo USERPROFILE=%USERPROFILE%
          echo PYTHON_ROOT=%PYTHON_ROOT%
          if not exist "%PYTHON_ROOT%\python.exe" (
            echo ERROR: Python 3.12 was not found at %PYTHON_ROOT%\python.exe
            exit /b 1
          )
          echo Python executable found.
          echo %PYTHON_ROOT%>>"%GITHUB_PATH%"
          echo %PYTHON_ROOT%\Scripts>>"%GITHUB_PATH%"
          "%PYTHON_ROOT%\python.exe" --version
          "%PYTHON_ROOT%\python.exe" -c "import sys; print(sys.executable)"

      - name: Install project
        shell: cmd
        run: |
          "%PYTHON_ROOT%\python.exe" -m pip install --disable-pip-version-check -e .

      - name: Validate required secrets
        shell: cmd
        run: |
          if "%DATABASE_URL%"=="" (
            echo ERROR: NEON_DATABASE_URL is not configured.
            exit /b 1
          )
          if "%OPENAI_API_KEY%"=="" if "%GEMINI_API_KEY%"=="" (
            echo ERROR: OPENAI_API_KEY or GEMINI_API_KEY is required.
            exit /b 1
          )
          echo Required secrets are configured.

      - name: Verify OpenD and run signal pipeline
        shell: cmd
        run: |
          echo MOOMOO_SIGNAL_SYMBOL=%MOOMOO_SIGNAL_SYMBOL%
          echo MOOMOO_SIGNAL_CANDLES=%MOOMOO_SIGNAL_CANDLES%
          echo MOOMOO_SIGNAL_INTERVAL=%MOOMOO_SIGNAL_INTERVAL%
          echo EXECUTE_PAPER=%EXECUTE_PAPER%
          echo MOOMOO_PAPER_TRADING_ENABLED=%MOOMOO_PAPER_TRADING_ENABLED%
          echo MOOMOO_LIVE_TRADING_ENABLED=%MOOMOO_LIVE_TRADING_ENABLED%
          "%PYTHON_ROOT%\python.exe" scripts/run_moomoo_signal_pipeline.py
