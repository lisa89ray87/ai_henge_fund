name: Moomoo Signal Pipeline

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "US stock symbol, for example US.AAPL"
        required: true
        default: "US.AAPL"
        type: string
      candles:
        description: "Number of candles to load"
        required: true
        default: "50"
        type: string
      interval:
        description: "Candle interval"
        required: true
        default: "5m"
        type: choice
        options:
          - "1m"
          - "5m"
          - "15m"
          - "30m"
          - "60m"
          - "1d"
      execute_paper:
        description: "Explicitly enable Moomoo SIMULATE paper execution"
        required: true
        default: false
        type: boolean

concurrency:
  group: moomoo-signal-pipeline
  cancel-in-progress: false

jobs:
  signal:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MOOMOO_OPEND_ENABLED: "true"
      MOOMOO_READ_ONLY: "true"
      MOOMOO_OPEND_HOST: "127.0.0.1"
      MOOMOO_OPEND_PORT: "11111"
      MOOMOO_SIGNAL_SYMBOL: ${{ inputs.symbol }}
      MOOMOO_SIGNAL_CANDLES: ${{ inputs.candles }}
      MOOMOO_SIGNAL_INTERVAL: ${{ inputs.interval }}
      EXECUTE_PAPER: ${{ inputs.execute_paper }}
      MOOMOO_PAPER_TRADING_ENABLED: "true"
      MOOMOO_LIVE_TRADING_ENABLED: "false"
      TRADINGAGENTS_LLM_MAX_RETRIES: "1"
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify preinstalled Python
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" --version
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -c "import sys; print(sys.executable)"

      - name: Install project
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -m pip install --upgrade pip
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -m pip install -e .

      - name: Validate required secrets
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL is not configured."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY) -and [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            Write-Error "OPENAI_API_KEY or GEMINI_API_KEY is required."
            exit 1
          }

      - name: Verify OpenD and run signal pipeline
        shell: cmd
        run: "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" scripts/run_moomoo_signal_pipeline.py
