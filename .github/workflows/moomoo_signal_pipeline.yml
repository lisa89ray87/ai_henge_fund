name: Moomoo Signal Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/paper_trade_kickstart"

concurrency:
  group: moomoo-signal-pipeline
  cancel-in-progress: false

jobs:
  signal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 420
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN }}
      AI_HEDGE_FUND_TELEGRAM_CHAT_ID: ${{ secrets.AI_HEDGE_FUND_TELEGRAM_CHAT_ID }}
      PYTHON_ROOT: 'C:\Users\limli\AppData\Local\Programs\Python\Python312'
      PYTHONUTF8: "1"
      MOOMOO_OPEND_ENABLED: "true"
      MOOMOO_READ_ONLY: "true"
      MOOMOO_OPEND_HOST: "127.0.0.1"
      MOOMOO_OPEND_PORT: "11111"
      MOOMOO_SIGNAL_CANDLES: "50"
      MOOMOO_SIGNAL_INTERVAL: "5m"
      MOOMOO_SIGNAL_MAX_AI_CANDIDATES: "10"
      MOOMOO_SIGNAL_MAX_PAPER_TRADES: "10"
      MOOMOO_SIGNAL_CYCLE_MINUTES: "10"
      SESSION_RUN_UNTIL_CLOSE: "true"
      EXECUTE_PAPER: "true"
      MOOMOO_PAPER_TRADING_ENABLED: "true"
      MOOMOO_LIVE_TRADING_ENABLED: "false"
      AI_HEDGE_FUND_STARTING_CAPITAL: "100"
      AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED: "90"
      AI_HEDGE_FUND_RISK_PER_TRADE_PCT: "50"
      AI_HEDGE_FUND_MAX_POSITIONS: "0"
      AI_HEDGE_FUND_MAX_DAILY_LOSS: "10"
      AI_HEDGE_FUND_LIVE_TRADING_ARMED: "false"
      AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS: "false"
      TRADINGAGENTS_LLM_MAX_RETRIES: "1"
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify self-hosted runner and Python
        shell: cmd
        run: |
          echo Runner identity:
          whoami
          echo USERPROFILE=%USERPROFILE%
          echo PYTHON_ROOT=%PYTHON_ROOT%
          if not exist "%PYTHON_ROOT%\python.exe" (
            echo ERROR: Python 3.12 was not found at %PYTHON_ROOT%\python.exe
            exit /b 1
          )
          echo Python executable found.
          echo %PYTHON_ROOT%>>"%GITHUB_PATH%"
          echo %PYTHON_ROOT%\Scripts>>"%GITHUB_PATH%"
          "%PYTHON_ROOT%\python.exe" --version
          "%PYTHON_ROOT%\python.exe" -c "import sys; print(sys.executable); print('UTF-8 mode:', sys.flags.utf8_mode)"

      - name: Install project
        shell: cmd
        run: |
          "%PYTHON_ROOT%\python.exe" -m pip install --disable-pip-version-check -e .

      - name: Validate required secrets
        shell: cmd
        run: |
          if "%DATABASE_URL%"=="" (
            echo ERROR: NEON_DATABASE_URL is not configured.
            exit /b 1
          )
          if "%OPENAI_API_KEY%"=="" if "%GEMINI_API_KEY%"=="" (
            echo ERROR: OPENAI_API_KEY or GEMINI_API_KEY is required.
            exit /b 1
          )
          if "%AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN%"=="" (
            echo ERROR: AI_HEDGE_FUND_TELEGRAM_BOT_TOKEN is not configured.
            exit /b 1
          )
          if "%AI_HEDGE_FUND_TELEGRAM_CHAT_ID%"=="" (
            echo ERROR: AI_HEDGE_FUND_TELEGRAM_CHAT_ID is not configured.
            exit /b 1
          )
          echo Required secrets are configured.
          echo Telegram notifier configuration is present.

      - name: Run Moomoo OpenD universe paper pipeline for full regular session
        shell: cmd
        run: |
          echo MOOMOO_SIGNAL_UNIVERSE=default configured universe
          echo MOOMOO_SIGNAL_CANDLES=%MOOMOO_SIGNAL_CANDLES%
          echo MOOMOO_SIGNAL_INTERVAL=%MOOMOO_SIGNAL_INTERVAL%
          echo MOOMOO_SIGNAL_MAX_AI_CANDIDATES=%MOOMOO_SIGNAL_MAX_AI_CANDIDATES%
          echo MOOMOO_SIGNAL_MAX_PAPER_TRADES=%MOOMOO_SIGNAL_MAX_PAPER_TRADES%
          echo MOOMOO_SIGNAL_CYCLE_MINUTES=%MOOMOO_SIGNAL_CYCLE_MINUTES%
          echo SESSION_RUN_UNTIL_CLOSE=%SESSION_RUN_UNTIL_CLOSE%
          echo EXECUTE_PAPER=%EXECUTE_PAPER%
          echo MOOMOO_PAPER_TRADING_ENABLED=%MOOMOO_PAPER_TRADING_ENABLED%
          echo MOOMOO_LIVE_TRADING_ENABLED=%MOOMOO_LIVE_TRADING_ENABLED%
          echo AI_HEDGE_FUND_STARTING_CAPITAL=%AI_HEDGE_FUND_STARTING_CAPITAL%
          echo AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED=%AI_HEDGE_FUND_MAX_CAPITAL_DEPLOYED%
          echo AI_HEDGE_FUND_RISK_PER_TRADE_PCT=%AI_HEDGE_FUND_RISK_PER_TRADE_PCT%
          echo AI_HEDGE_FUND_MAX_POSITIONS=%AI_HEDGE_FUND_MAX_POSITIONS%
          echo AI_HEDGE_FUND_MAX_DAILY_LOSS=%AI_HEDGE_FUND_MAX_DAILY_LOSS%
          echo AI_HEDGE_FUND_LIVE_TRADING_ARMED=%AI_HEDGE_FUND_LIVE_TRADING_ARMED%
          echo AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS=%AI_HEDGE_FUND_ALLOW_EXTENDED_HOURS%
          "%PYTHON_ROOT%\python.exe" scripts/run_moomoo_signal_pipeline.py
