name: TradingAgents Signal Reasoning

on:
  workflow_dispatch:

concurrency:
  group: tradingagents-reasoning
  cancel-in-progress: false

jobs:
  reasoning:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRADINGAGENTS_LLM_MAX_RETRIES: "1"
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate required secrets are configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY) -and [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            Write-Error "At least one AI provider secret is required: OPENAI_API_KEY or GEMINI_API_KEY."
            exit 1
          }
          if (-not [string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
            Write-Host "OpenAI provider: configured (primary)."
          }
          else {
            Write-Host "OpenAI provider: unavailable; Gemini will be used as primary."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            Write-Host "Gemini provider: configured (fallback/secondary)."
          }
          else {
            Write-Host "Gemini provider: not configured."
          }

      - name: Run real TradingAgents reasoning boundary
        shell: powershell
        run: python scripts/run_tradingagents_reasoning.py
