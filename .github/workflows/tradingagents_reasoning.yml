name: TradingAgents Signal Reasoning

on:
  workflow_dispatch:

concurrency:
  group: tradingagents-reasoning
  cancel-in-progress: false

jobs:
  reasoning:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEBUG: "false"
      PYTHON_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate required secrets are configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY GitHub Actions secret is not configured for this repository."
            exit 1
          fi

      - name: Run real TradingAgents reasoning boundary
        run: python scripts/run_tradingagents_reasoning.py
