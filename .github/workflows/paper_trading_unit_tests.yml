name: Paper Trading Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ai_henge_fund/paper_trading/**"
      - "src/ai_henge_fund/portfolio/**"
      - "scripts/send_paper_day_summary.py"
      - "tests/paper_trading/**"
      - ".github/workflows/paper_trading_unit_tests.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate valid Python 3.12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\resolve_python312.ps1"

      - name: Run trade journal, lifecycle, and position unit tests
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m pytest tests\paper_trading\test_trade_journal_v2.py tests\paper_trading\test_moomoo_lifecycle_journal.py tests\paper_trading\test_partial_position.py -q
