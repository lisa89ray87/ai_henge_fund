name: Paper Trading Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ai_henge_fund/paper_trading/**"
      - "src/ai_henge_fund/portfolio/**"
      - "src/ai_henge_fund/risk/**"
      - "src/ai_henge_fund/trading/**"
      - "src/ai_henge_fund/tradingagents/**"
      - "scripts/send_paper_day_summary.py"
      - "tests/paper_trading/**"
      - "tests/risk/**"
      - "tests/trading/**"
      - "tests/tradingagents/**"
      - "tests/market_data/**"
      - "tests/test_entry_trigger_context.py"
      - ".github/workflows/paper_trading_unit_tests.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate valid Python 3.12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\resolve_python312.ps1"

      - name: Run trade journal, lifecycle, and position unit tests
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m pytest tests\paper_trading\test_trade_journal_v2.py tests\paper_trading\test_moomoo_lifecycle_journal.py tests\paper_trading\test_partial_position.py tests\risk\test_gate.py tests\market_data\test_market_regime.py tests\trading\test_pipeline.py tests\trading\test_combined_paper_stop_risk.py tests\tradingagents\test_adapter.py tests\test_third_party_fallback.py tests\paper_trading\test_unmatched_force_flat.py tests\test_entry_trigger_context.py -q

      - name: Third-party API connectivity (non-trading)
        shell: powershell
        env:
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
        run: |
          & $env:PYTHON_312_PATH scripts\\probe_third_party_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
