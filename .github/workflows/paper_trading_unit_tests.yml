name: Paper Trading Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ai_henge_fund/paper_trading/**"
      - "src/ai_henge_fund/portfolio/**"
      - "scripts/send_paper_day_summary.py"
      - "tests/paper_trading/**"
      - ".github/workflows/paper_trading_unit_tests.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run trade journal and lifecycle unit tests
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -m pytest tests\paper_trading\test_trade_journal_v2.py tests\paper_trading\test_moomoo_lifecycle_journal.py -q
