name: Moomoo MCP Read-Only Connectivity

on:
  workflow_dispatch:

concurrency:
  group: moomoo-mcp-readonly
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      MOOMOO_MCP_ENABLED: "true"
      MOOMOO_MCP_URL: "https://mcp.moomoo.com/mcp"
      MOOMOO_MCP_ACCESS_TOKEN: ${{ secrets.MOOMOO_MCP_ACCESS_TOKEN }}
      MOOMOO_VERIFY_SYMBOL: "AAPL"
      PYTHON_ENV: production
      DEBUG: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Moomoo MCP secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MOOMOO_MCP_ACCESS_TOKEN)) {
            Write-Error "MOOMOO_MCP_ACCESS_TOKEN GitHub Actions secret is not configured."
            Write-Host "Complete Moomoo MCP OAuth in a supported MCP client, then store the access token as this repository secret."
            exit 1
          }

      - name: Verify read-only Moomoo MCP quote
        shell: powershell
        run: python scripts/verify_moomoo_mcp_readonly.py
