name: AI Henge Fund Neon Integration

on:
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate existing valid Python 3.12
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe",
            "C:\Python312\python.exe"
          ) | Select-Object -Unique

          $python = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Write-Host "Checking $candidate"
              & $candidate --version
              if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path (Split-Path $candidate) "Lib"))) {
                $python = $candidate
                break
              }
            }
          }

          if (-not $python) {
            Write-Error "No valid existing Python 3.12 installation was found. The incomplete GitHub Actions toolcache installation was intentionally not used."
            exit 1
          }

          Write-Host "Using existing Python: $python"
          & $python -c "import sys; print(sys.version); print(sys.executable); print(sys.prefix)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pythonDir = Split-Path $python
          "PATH=$pythonDir;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON_EXECUTABLE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install project with development test dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXECUTABLE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXECUTABLE -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Run test suite
        shell: powershell
        run: |
          & $env:PYTHON_EXECUTABLE -m pytest -q

      - name: Show pre-migration state
        shell: powershell
        run: alembic current

      - name: Apply AI Henge Fund additive schema
        shell: powershell
        run: alembic upgrade head

      - name: Verify Alembic migration state
        shell: powershell
        run: alembic check

      - name: Show migration state
        shell: powershell
        run: |
          alembic current
          alembic heads

      - name: Import existing daily_stock_analyse signals
        shell: powershell
        run: & $env:PYTHON_EXECUTABLE scripts/sync_daily_stock_signals.py

      - name: Verify signal bridge and idempotency
        shell: powershell
        run: & $env:PYTHON_EXECUTABLE scripts/verify_daily_stock_signal_sync.py
