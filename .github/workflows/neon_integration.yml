name: AI Henge Fund Neon Integration

on:
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project with development test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate required secret is configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Show pre-migration state
        run: alembic current

      - name: Apply AI Henge Fund additive schema
        run: alembic upgrade head

      - name: Verify Alembic migration state
        run: alembic check

      - name: Show migration state
        run: |
          alembic current
          alembic heads

      - name: Import existing daily_stock_analyse signals
        run: python scripts/sync_daily_stock_signals.py

      - name: Verify signal bridge and idempotency
        run: python scripts/verify_daily_stock_signal_sync.py
