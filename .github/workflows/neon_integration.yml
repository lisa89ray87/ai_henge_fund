name: AI Henge Fund Neon Integration

on:
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project with development test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Run test suite
        shell: powershell
        run: python -m pytest -q

      - name: Show pre-migration state
        shell: powershell
        run: alembic current

      - name: Apply AI Henge Fund additive schema
        shell: powershell
        run: alembic upgrade head

      - name: Verify Alembic migration state
        shell: powershell
        run: alembic check

      - name: Show migration state
        shell: powershell
        run: |
          alembic current
          alembic heads

      - name: Import existing daily_stock_analyse signals
        shell: powershell
        run: python scripts/sync_daily_stock_signals.py

      - name: Verify signal bridge and idempotency
        shell: powershell
        run: python scripts/verify_daily_stock_signal_sync.py
