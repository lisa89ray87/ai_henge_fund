name: AI Henge Fund Neon Integration

on:
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use existing Python 3.12
        shell: powershell
        run: |
          $python = "D:\actions-runner\_work\_tool\Python\3.12.10\x64\python.exe"
          if (-not (Test-Path $python)) {
            Write-Error "Expected Python executable was not found: $python"
            exit 1
          }
          & $python --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Existing Python executable could not be started."
            exit 1
          }
          $env:PATH = "$(Split-Path $python);$env:PATH"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON_EXECUTABLE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install project with development test dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXECUTABLE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXECUTABLE -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Run test suite
        shell: powershell
        run: |
          & $env:PYTHON_EXECUTABLE -m pytest -q

      - name: Show pre-migration state
        shell: powershell
        run: alembic current

      - name: Apply AI Henge Fund additive schema
        shell: powershell
        run: alembic upgrade head

      - name: Verify Alembic migration state
        shell: powershell
        run: alembic check

      - name: Show migration state
        shell: powershell
        run: |
          alembic current
          alembic heads

      - name: Import existing daily_stock_analyse signals
        shell: powershell
        run: & $env:PYTHON_EXECUTABLE scripts/sync_daily_stock_signals.py

      - name: Verify signal bridge and idempotency
        shell: powershell
        run: & $env:PYTHON_EXECUTABLE scripts/verify_daily_stock_signal_sync.py
