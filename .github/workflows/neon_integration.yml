name: AI Henge Fund Neon Integration

on:
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate existing valid Python 3.12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\resolve_python312.ps1"

      - name: Install project with development test dependencies
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_312_PATH -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Run test suite
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m pytest -q

      - name: Show pre-migration state
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m alembic current

      - name: Apply AI Henge Fund additive schema
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m alembic upgrade head

      - name: Verify Alembic migration state
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m alembic check

      - name: Show migration state
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m alembic current
          & $env:PYTHON_312_PATH -m alembic heads

      - name: Import existing daily_stock_analyse signals
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts/sync_daily_stock_signals.py

      - name: Verify signal bridge and idempotency
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts/verify_daily_stock_signal_sync.py
