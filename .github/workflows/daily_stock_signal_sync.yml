name: Daily Stock Signal Sync

on:
  workflow_dispatch:
  schedule:
    # Keep the AI Henge Fund signal mirror close to the existing live alert engine.
    - cron: "*/5 * * * 1-5"

concurrency:
  group: daily-stock-signal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: production
      DAILY_STOCK_SYNC_LIMIT: "500"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate required secret is configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          fi

      - name: Import latest daily_stock_analyse signals
        run: python scripts/sync_daily_stock_signals.py

      - name: Verify bridge idempotency
        run: python scripts/verify_daily_stock_signal_sync.py
