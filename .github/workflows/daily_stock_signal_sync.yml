name: Daily Stock Signal Sync

on:
  workflow_dispatch:

concurrency:
  group: daily-stock-signal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: production
      DAILY_STOCK_SYNC_LIMIT: "500"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Python
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" --version
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -c "import sys; print(sys.executable)"

      - name: Install project
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" -m pip install -e .

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Import latest daily_stock_analyse signals
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" scripts/sync_daily_stock_signals.py

      - name: Verify bridge idempotency
        shell: cmd
        run: |
          "C:\Users\limli\AppData\Local\Programs\Python\Python312\python.exe" scripts/verify_daily_stock_signal_sync.py
