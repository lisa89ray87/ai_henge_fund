name: Daily Stock Signal Sync

on:
  workflow_dispatch:

concurrency:
  group: daily-stock-signal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEBUG: "false"
      PYTHON_ENV: production
      DAILY_STOCK_SYNC_LIMIT: "500"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate valid Python 3.12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\resolve_python312.ps1"

      - name: Install project
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -m pip install -e .

      - name: Validate required secret is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            Write-Error "NEON_DATABASE_URL GitHub Actions secret is not configured for this repository."
            exit 1
          }

      - name: Import latest daily_stock_analyse signals
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts/sync_daily_stock_signals.py

      - name: Verify bridge idempotency
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts/verify_daily_stock_signal_sync.py
