name: Moomoo OpenD Read-Only Test

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate valid Python 3.12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\resolve_python312.ps1"

      - name: Check Moomoo SDK
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH -c "import moomoo; print('Moomoo SDK: PASS')"

      - name: Verify Moomoo OpenD read-only market data
        shell: powershell
        run: |
          & $env:PYTHON_312_PATH scripts/test_moomoo_my_readonly.py
