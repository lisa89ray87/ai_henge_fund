[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hedge-fund"
version = "0.1.0"
description = "Production-style AI Hedge Fund using ChatGPT + Moomoo MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Raymond Tan" }
]

dependencies = [
    # OpenAI
    "openai>=2.0.0",

    # AI
    "langchain>=0.3.0",
    "langgraph>=0.2.0",

    # Web
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    # Dashboard
    "streamlit>=1.50.0",

    # Database
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.16.0",

    # Data
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "pyarrow>=21.0.0",

    # Environment
    "python-dotenv>=1.1.0",

    # HTTP
    "httpx>=0.28.0",
    "requests>=2.32.0",

    # Validation
    "pydantic>=2.11.0",

    # Logging
    "loguru>=0.7.3",

    # Scheduling
    "apscheduler>=3.11.0",

    # Redis
    "redis>=6.4.0",

    # Retry
    "tenacity>=9.1.0",

    # Utilities
    "orjson>=3.11.0",
    "rich>=14.0.0",
    "typer>=0.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]